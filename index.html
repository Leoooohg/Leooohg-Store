<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Cars Store</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0b1020,#121212);color:#fff}
header{padding:20px;text-align:center;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);position:sticky;top:0}
.card{max-width:380px;margin:40px auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.3);border-radius:18px;padding:20px;box-shadow:0 0 30px rgba(0,0,0,.4)}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none}
button{padding:12px 18px;border:none;border-radius:10px;background:linear-gradient(90deg,#d4af37,#ffd700);font-weight:bold;cursor:pointer}
.hidden{display:none}
img{width:100%;border-radius:12px}
.price{font-size:2em;color:#ffd700}
</style></head><body>
<header><h1>Luxury Auto Store</h1></header>
<div id="login" class="card">
<h2>Crear cuenta</h2>
<input id="u" placeholder="Correo">
<input id="p" type="password" placeholder="Contraseña">
<button onclick="enter()">Crear cuenta / Ingresar</button>
<p style="font-size:.8em;color:#bbb">* Demostración local. Para cuentas reales usa Firebase.</p>
</div>
<div id="shop" class="hidden">
<div class="card">
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1200">
<h2>Pack Autos Premium</h2>
<p>Vehículos exclusivos para tu servidor.</p>
<button onclick="document.getElementById('shop').classList.add('hidden');document.getElementById('prod').classList.remove('hidden')">Ver producto</button>
</div></div>
<div id="prod" class="hidden">
<div class="card">
<h2>Pack Autos Premium</h2>
<ul><li>BMW M3</li><li>Audi RS7</li><li>Ferrari SF90</li><li>Lamborghini Huracán</li><li>Porsche 911 Turbo S</li></ul>
<div class="price">30.000 CLP</div>
<button onclick="window.open('https://mpago.la/2V3ohUi','_blank')">Comprar Ahora</button>
</div></div>
<script>
function enter(){
 if(!u.value||!p.value){alert('Completa los campos');return;}
 localStorage.setItem('user',u.value);
 login.classList.add('hidden');shop.classList.remove('hidden');
}
window.onload=()=>{if(localStorage.getItem('user')){login.classList.add('hidden');shop.classList.remove('hidden');}}
</script>
</body></html>
